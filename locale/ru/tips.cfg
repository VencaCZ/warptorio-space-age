[tips-and-tricks-item-description]
warptorio=Warptorio (Space Age).
; warptorio-warp-trains=Trains can be warped between the [font=default-bold]ground[/font], the [font=default-bold]factory floor[/font] and the [font=default-bold]garden floor[/font] using special train stations.\n\nTo warp a train, it must be [color=yellow]fully stopped[/color] at a station named:\n • [color=orange]WarpGround[/color] (go to the ground floor)\n • [color=orange]WarpFactory[/color] (go to the factory floor)\n • [color=orange]WarpGarden[/color] (go to the garden floor, needs [technology=warp-train-biochamber])\n\n[color=red][font=default-bold]Important:[/font][/color]\nBoth stations must have the [color=red]same orientation[/color] (north, south, east, or west).\n\nA train will [font=default-bold]not warp[/font] if:\n • the station orientations do not match\n • it is in manual mode, or someone is riding in it\n • the track behind the destination station is [font=default-bold]shorter than the train[/font]\n • the landing area on the other side is blocked\n • either station sits outside the edge of the platform\n\nA blocked train is [font=default-bold]not cancelled[/font]. It stays queued and warps by itself as soon as the way is clear. After 30 seconds a chat message explains what is holding it up — those messages can be switched off in the mod settings.\n\n[color=green]Tip:[/color] Copy or blueprint the station so the orientation matches on both floors. If you want several train stops per cardinal direction, disable all but one so the train goes to the station you intend.
warptorio-warp-trains=Поезда можно перемещать между [font=default-bold]наземной[/font] и [font=default-bold]заводской платформами[/font] с помощью специальных железнодорожных станций.\n\nЧтобы переместить поезд, он должен [color=yellow]полностью остановиться[/color] на станции с именем:\n • [color=orange]WarpGround[/color] (если вы хотите попасть на наземную платформу из заводской)\n • [color=orange]WarpFactory[/color] (если вы хотите попасть на заводскую платформу с наземной)\n • [color=orange]WarpGarden[/color] (если вы хотите попасть на садовую платформу, требуется [technology=warp-train-biochamber])\n\n[color=red][font=default-bold]Важно:[/font][/color]\nОбе станции должны иметь [color=red]одинаковую ориентацию[/color] (север, юг, восток или запад).\n\nЕсли названия станций совпадают, а ориентация отличается, поезд [font=default-bold]не переместится[/font].\nПоезд также [font=default-bold]не переместится[/font], если он находится в ручном управлении или если внутри есть пассажир.\n\n[color=green]Совет:[/color] Скопируйте станцию или используйте чертёж, чтобы ориентация совпадала на обоих уровнях. Если вы хотите иметь несколько станций для одного направления, отключите все, кроме одной, чтобы поезд гарантированно прибыл на нужную станцию.

; warptorio-evolution-scaling=Enemy evolution in Warptorio is [font=default-bold]not based on time or pollution[/font]. It is scaled by your progress through key platform researches.\n\nEach unlocked milestone research raises the enemy evolution to a fixed value:\n • [technology=warp-ground-platform-4] -> [color=orange]11%[/color]\n • [technology=warp-factory-platform-3] -> [color=orange]15%[/color]\n • [technology=warp-ground-platform-5] -> [color=orange]21%[/color]\n • [technology=warp-factory-platform-4] -> [color=orange]31%[/color]\n • [technology=warp-ground-platform-6] -> [color=orange]41%[/color]\n • [technology=warp-factory-platform-5] -> [color=orange]51%[/color]\n • [technology=warp-ground-platform-7] -> [color=orange]61%[/color]\n • [technology=warp-factory-platform-6] -> [color=orange]71%[/color]\n • [technology=warp-ground-platform-8] -> [color=orange]81%[/color]\n • [technology=warp-factory-platform-7] -> [color=orange]91%[/color]\n • [technology=warp-end-prepare] -> [color=red]100%[/color]\n\nEvolution only ever takes these exact values — there is nothing in between, so it moves in jumps as you research.\n\n[font=default-bold]Quality enemies:[/font] once evolution reaches the threshold set in the mod settings ([color=orange]95%[/color] by default, which means only after [technology=warp-end-prepare]), enemies start spawning at [font=default-bold]higher quality[/font], climbing a tier every few warps. Lower that setting to meet them earlier — set it to [color=orange]90%[/color] or below to have them appear before the final research.\n\n[color=green]Tip:[/color] If you want to delay higher-tier enemies, postpone those researches until your base is ready.
warptorio-evolution-scaling=Эволюция врагов в Warptorio [font=default-bold]не зависит от времени или загрязнения[/font]. Она увеличивается по мере вашего прогресса в ключевых исследованиях платформы.\n\nКаждое выполненное ключевое исследование повышает эволюцию врагов до фиксированного значения:\n • [technology=warp-ground-platform-4] -> [color=orange]11%[/color]\n • [technology=warp-factory-platform-3] -> [color=orange]15%[/color]\n • [technology=warp-ground-platform-5] -> [color=orange]21%[/color]\n • [technology=warp-factory-platform-4] -> [color=orange]31%[/color]\n • [technology=warp-ground-platform-6] -> [color=orange]41%[/color]\n • [technology=warp-factory-platform-5] -> [color=orange]51%[/color]\n • [technology=warp-ground-platform-7] -> [color=orange]61%[/color]\n • [technology=warp-factory-platform-6] -> [color=orange]71%[/color]\n • [technology=warp-ground-platform-8] -> [color=orange]81%[/color]\n • [technology=warp-factory-platform-7] -> [color=orange]91%[/color]\n • [technology=warp-end-prepare] -> [color=red]100%[/color]\n\n[color=green]Совет:[/color] Если вы хотите отложить появление более сильных врагов, отложите эти исследования, пока ваша база не будет готова.
