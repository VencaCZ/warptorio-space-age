[tips-and-tricks-item-description]
warptorio=Warptorio (Space Age).
warptorio-warp-trains=Trains can be warped between the [font=default-bold]ground[/font], the [font=default-bold]factory floor[/font] and the [font=default-bold]garden floor[/font] using special train stations.\n\nTo warp a train, it must be [color=yellow]fully stopped[/color] at a station named:\n • [color=orange]WarpGround[/color] (go to the ground floor)\n • [color=orange]WarpFactory[/color] (go to the factory floor)\n • [color=orange]WarpGarden[/color] (go to the garden floor, needs [technology=warp-train-biochamber])\n\n[color=red][font=default-bold]Important:[/font][/color]\nBoth stations must have the [color=red]same orientation[/color] (north, south, east, or west).\n\nA train will [font=default-bold]not warp[/font] if:\n • the station orientations do not match\n • it is in manual mode, or someone is riding in it\n • the track behind the destination station is [font=default-bold]shorter than the train[/font]\n • the landing area on the other side is blocked\n • either station sits outside the edge of the platform\n\nA blocked train is [font=default-bold]not cancelled[/font]. It stays queued and warps by itself as soon as the way is clear. After 30 seconds a chat message explains what is holding it up — those messages can be switched off in the mod settings.\n\n[color=green]Tip:[/color] Copy or blueprint the station so the orientation matches on both floors. If you want several train stops per cardinal direction, disable all but one so the train goes to the station you intend.
warptorio-asteroids=Once [technology=warp-factory-platform-2] is researched, warps no longer teleport instantly — your factory travels [font=default-bold]through space[/font], and asteroids spawn instead of biters during the transition.\n\nAsteroid sizes are [font=default-bold]not fixed[/font] — all tiers below your current evolution spawn [font=default-bold]simultaneously[/font]:\n • Evolution [color=orange]> 0%[/color] -> Small asteroids\n • Evolution [color=orange]> 25%[/color] -> + Medium asteroids\n • Evolution [color=orange]> 61%[/color] -> + Big asteroids\n • Evolution [color=orange]> 81%[/color] -> + Huge asteroids\n\n[color=green]Tip:[/color] Asteroids do not spawn until your evolution is above 0%, but prepare asteroid collectors before that happens — evolution rises quickly with platform research.
warptorio-planet-hopping=The game tracks the last [font=default-bold]2 planets[/font] you visited.\n\nIf the [font=default-bold]Next Planet[/font] display in your HUD shows a name in [color=red]red[/color], it means you are about to [font=default-bold]hop[/font] — returning to the planet you were on just [font=default-bold]two warps ago[/font].\n\n[color=red][font=default-bold]Hopping consequence:[/font][/color]\nThe enemy [font=default-bold]wave index[/font] and [font=default-bold]wave timer[/font] are [font=default-bold]not reset[/font] when hopping. You continue the waves exactly where you left off on that planet — enemies will be just as strong (or stronger) as when you last departed.\n\n[color=green]Tip:[/color] A [color=red]red[/color] destination is a warning. If your defences are not ready for a harder fight, use the remaining time to strengthen them before the warp.
warptorio-evolution-scaling=Enemy evolution in Warptorio is [font=default-bold]not based on time or pollution[/font]. It is scaled by your progress through key platform researches.\n\nEach unlocked milestone research raises the enemy evolution to a fixed value:\n • [technology=warp-ground-platform-4] -> [color=orange]11%[/color]\n • [technology=warp-factory-platform-3] -> [color=orange]15%[/color]\n • [technology=warp-ground-platform-5] -> [color=orange]21%[/color]\n • [technology=warp-factory-platform-4] -> [color=orange]31%[/color]\n • [technology=warp-ground-platform-6] -> [color=orange]41%[/color]\n • [technology=warp-factory-platform-5] -> [color=orange]51%[/color]\n • [technology=warp-ground-platform-7] -> [color=orange]61%[/color]\n • [technology=warp-factory-platform-6] -> [color=orange]71%[/color]\n • [technology=warp-ground-platform-8] -> [color=orange]81%[/color]\n • [technology=warp-factory-platform-7] -> [color=orange]91%[/color]\n • [technology=warp-end-prepare] -> [color=red]100%[/color]\n\nEvolution only ever takes these exact values — there is nothing in between, so it moves in jumps as you research.\n\n[font=default-bold]Quality enemies:[/font] once evolution reaches the threshold set in the mod settings ([color=orange]95%[/color] by default, which means only after [technology=warp-end-prepare]), enemies start spawning at [font=default-bold]higher quality[/font], climbing a tier every few warps. Lower that setting to meet them earlier — set it to [color=orange]90%[/color] or below to have them appear before the final research.\n\n[color=green]Tip:[/color] If you want to delay higher-tier enemies, postpone those researches until your base is ready.

warptorio-warp-combinator=The [item=warp-constant-combinator] is unlocked by [technology=warp-circuit-network] and reports the state of the warp to the circuit network. It updates itself every tick — you only have to wire it up.\n\nIt sends:\n • [virtual-signal=signal-T] Seconds until the forced warp\n • [virtual-signal=signal-W] Current enemy wave number\n • [virtual-signal=signal-V] Seconds until the next enemy wave\n • [virtual-signal=signal-A] How many warps you have made so far\n • [virtual-signal=signal-J] [color=orange]1[/color] while the factory is travelling between planets\n • [virtual-signal=signal-D] Seconds left of that journey\n\nIt also sends a signal for each planet involved:\n • Value [color=orange]1[/color] -> the planet you are on now\n • Value [color=orange]2[/color] -> the planet you will warp to next\n • Value [color=orange]3[/color] -> both at once, meaning you are staying where you are\n\nA planet only gets a signal if it is a real planet, so the [font=default-bold]void[/font] destination sends nothing.\n\n[color=green]Tip:[/color] [virtual-signal=signal-J] is the cleanest way to drive anything that should only run while you are in space — powering down mining outposts, arming defences before you land, or holding a train until the warp is over.
warptorio-floor-limits=The extra floors are not just more space — some things cannot be built on them.\n\n[font=default-bold]Roboports[/font]\nBy default roboports are [color=red]blocked on the garden floor[/color]. Placing one returns it to your inventory. Blocking them on the [font=default-bold]factory floor[/font] as well is a separate mod setting, off by default, so you can switch either floor on or off to taste.\n\n[font=default-bold]Biolabs[/font]\n[entity=biolab] can only be built on the [font=default-bold]ground floor[/font] — never on the factory or the garden floor.\n\nThe ground floor holds [color=orange]4[/color] of them. Every level of [technology=warp-biolab-limit-1] raises that by [color=orange]2[/color], and the research is infinite. Building past the limit hands the biolab straight back to you.\n\n[color=green]Tip:[/color] Biolabs ride along with the ground floor when you warp, so the ones you place are not lost on the next jump.